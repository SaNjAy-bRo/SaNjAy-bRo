name: Refresh profile stats

# Rebuilds the live "GitHub pulse" card and the contribution snake,
# then publishes them to the `output` branch that README.md points at.
on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build GitHub pulse card
        run: node scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          GH_ORG: clevercroworg
          OUT_DIR: dist

      - name: Build contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1b1915&color_dots=#ebedf0,#f6dcc0,#efb37a,#e48d3e,#e0791b
            dist/snake-dark.svg?palette=github-dark&color_snake=#ece6da&color_dots=#161b22,#3d2e12,#7a5414,#c07f17,#f5a524

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: refresh profile stats"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
