<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 146 44" width="146" height="44" role="img" aria-label="Instagram">
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',Menlo,monospace; }
    .serif { font-family: Georgia,'Iowan Old Style','Times New Roman','Liberation Serif',serif; }
    .a { animation: a 2.8s ease-in-out infinite; } @keyframes a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(2px,-2px); } }
  </style>
  <rect x="0.5" y="0.5" width="145" height="43" rx="10" fill="#fffdf9" stroke="#d9d1c1"/>
  <text x="20" y="27.5" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.2" fill="#1b1915">INSTAGRAM</text>
  <g class="a"><text x="126" y="27.5" text-anchor="end" class="mono" font-size="14" font-weight="700" fill="#e0791b">↗</text></g>
</svg>
