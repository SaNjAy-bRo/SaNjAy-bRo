<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Tanubhi Couture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f5ff"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#d97706" stop-opacity="0.18"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></radialGradient>
    <clipPath id="cl"><rect x="1" y="1" width="598" height="228" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
    .sweep { animation: sweep 7s ease-in-out infinite; animation-delay: 5.4s; }
    @keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%,100% { transform: translateX(660px) skewX(-20deg); } }
    .gl { animation: gl 6s ease-in-out infinite alternate; }
    @keyframes gl { from { opacity: .55; } to { opacity: 1; } }
    .live { transform-box: fill-box; transform-origin: center; animation: lv 1.8s ease-out infinite; }
    @keyframes lv { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
  </style>
  <g clip-path="url(#cl)">
    <rect width="600" height="230" fill="url(#bg)"/>
    <rect class="gl" width="600" height="230" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="-20" width="140" height="270" fill="url(#sh)"/>
    <rect x="0" y="0" width="5" height="230" fill="url(#ac)"/>
  </g>
  <rect x="1" y="1" width="598" height="228" rx="22" fill="none" stroke="url(#ac)" stroke-opacity="0.5"/>

  <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#ac)"/>
  <text x="54" y="61" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#ffffff">TC</text>
  <text x="96" y="52" class="sans" font-size="23" font-weight="800" fill="#0f172a">Tanubhi Couture</text>
  <text x="96" y="76" class="mono" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#475569">HAUTE COUTURE &amp; SPA</text>

  <g transform="translate(508 30)">
    <rect width="66" height="26" rx="13" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.5"/>
    <circle class="live" cx="15" cy="13" r="3.5" fill="#059669"/>
    <circle cx="15" cy="13" r="3.5" fill="#059669"/>
    <text x="26" y="17.5" class="mono" font-size="11.5" font-weight="800" fill="#059669">LIVE</text>
  </g>

  <text x="28" y="122" class="sans" font-size="16" fill="#0f172a" fill-opacity="0.9">Multi-stylist slot calendar</text>
  <text x="28" y="146" class="sans" font-size="16" fill="#0f172a" fill-opacity="0.9">under-20s reservation flow</text>
  <rect x="28.0" y="176" width="98.0" height="28" rx="8" fill="#db2777" fill-opacity="0.10" stroke="#db2777" stroke-opacity="0.35"/><text x="40.0" y="194.5" class="mono" font-size="12.5" font-weight="600" fill="#0f172a" fill-opacity="0.85">Next.js 15</text><rect x="134.0" y="176" width="61.0" height="28" rx="8" fill="#db2777" fill-opacity="0.10" stroke="#db2777" stroke-opacity="0.35"/><text x="146.0" y="194.5" class="mono" font-size="12.5" font-weight="600" fill="#0f172a" fill-opacity="0.85">Redis</text><rect x="203.0" y="176" width="98.0" height="28" rx="8" fill="#db2777" fill-opacity="0.10" stroke="#db2777" stroke-opacity="0.35"/><text x="215.0" y="194.5" class="mono" font-size="12.5" font-weight="600" fill="#0f172a" fill-opacity="0.85">TypeScript</text>
  <text x="572" y="196" text-anchor="end" class="sans" font-size="20" font-weight="700" fill="#d97706">↗</text>
</svg>
