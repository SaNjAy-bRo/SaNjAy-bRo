<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="GitHub pulse">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.7"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#06b6d4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
    .in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes in { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <g class="in">
    <g transform="translate(44 50)">
      <rect class="spin" x="-26" y="-26" width="52" height="52" rx="14" fill="none" stroke="url(#g)" stroke-width="2" stroke-dasharray="10 6"/>
      <rect x="-19" y="-19" width="38" height="38" rx="10" fill="url(#g)" opacity="0.14"/>
      <text y="7" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#8b5cf6">04</text>
    </g>
    <text x="104" y="34" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#8b93a7">LIVE · REFRESHED DAILY</text>
    <text x="102" y="70" class="sans" font-size="32" font-weight="800" letter-spacing="-0.5" fill="url(#g)" textLength="222" lengthAdjust="spacingAndGlyphs">GitHub pulse</text>
    <rect x="362" y="58" width="828" height="2" rx="1" fill="url(#fade)"/>
    <rect x="362" y="57" width="120" height="4" rx="2" fill="url(#glint)">
      <animate attributeName="x" values="362;1070;362" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    </rect>
  </g>
</svg>
