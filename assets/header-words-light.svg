<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 84" width="1200" height="84" role="img" aria-label="Kind words">
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',Menlo,monospace; }
    .serif { font-family: Georgia,'Iowan Old Style','Times New Roman','Liberation Serif',serif; }
    
    .draw { animation: draw 1.4s cubic-bezier(.2,.8,.2,1) .2s both; }
    @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .cube { transform-box: fill-box; transform-origin: center; animation: hop 3.2s ease-in-out infinite; }
    @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-4px); } 90% { transform: translateY(0); } }
    
  </style>
  <g class="cube"><polygon points="30.5,33.2 18.0,40.4 18.0,26.0 30.5,18.8" fill="#864810" /><polygon points="5.5,33.2 18.0,40.4 18.0,26.0 5.5,18.8" fill="#ae5e15" /><polygon points="18.0,11.6 30.5,18.8 18.0,26.0 5.5,18.8" fill="#e0791b" /></g>
  <text x="54" y="44" class="mono" font-size="15" font-weight="700" fill="#e0791b">05</text>
  <text x="84" y="46" class="sans" font-size="32" font-weight="800" letter-spacing="-1" fill="#1b1915">Kind words</text>
  <text x="1196" y="44" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#6f6a60">FROM A CLIENT</text>
  <rect x="0" y="66" width="1200" height="1" fill="#d9d1c1"/>
  <rect x="0" y="65" width="96" height="3" fill="#e0791b">
    <animate attributeName="width" values="0;96" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
  </rect>
</svg>
