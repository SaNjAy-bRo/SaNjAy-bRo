<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Clever Crow">
  <defs><clipPath id="wclip"><rect x="-80" y="0" width="160" height="80"/></clipPath></defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',Menlo,monospace; }
    .serif { font-family: Georgia,'Iowan Old Style','Times New Roman','Liberation Serif',serif; }
    
    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: .6; } to { transform: scale(2.8); opacity: 0; } }
    .arrow { animation: arrow 2.6s ease-in-out infinite; }
    @keyframes arrow { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
    .head { transform-box: fill-box; transform-origin: left bottom; animation: tilt 5s ease-in-out infinite; } @keyframes tilt { 0%,60%,100% { transform: rotate(0); } 70%,85% { transform: rotate(-14deg); } }.eye { animation: eye 4s steps(1) infinite; } @keyframes eye { 0%,92% { opacity: 1; } 93%,97% { opacity: 0; } }
    
  </style>
  <rect x="0.5" y="0.5" width="599" height="249" rx="16" fill="#12161e" stroke="#232a36"/>
  <text x="32" y="44" class="mono" font-size="12" font-weight="700" letter-spacing="1.8" fill="#f5a524">08</text>
  <text x="58" y="44" class="mono" font-size="12" letter-spacing="1.8" fill="#8b93a3">STUDIO WEBSITE</text>
  <text x="30" y="88" class="sans" font-size="29" font-weight="800" letter-spacing="-0.8" fill="#ece6da">Clever Crow</text>
  <text x="32" y="132" class="sans" font-size="16" fill="#c9c3b6">The studio's own site, with landing</text><text x="32" y="156" class="sans" font-size="16" fill="#c9c3b6">pages and a leads dashboard.</text>
  <line x1="32" x2="568" y1="196" y2="196" stroke="#232a36"/>
  <text x="32" y="225" class="mono" font-size="11.5" letter-spacing="1.4" fill="#8b93a3">NEXT.JS · TYPESCRIPT · VERCEL</text>
  <g class="arrow"><text x="568" y="225" text-anchor="end" class="mono" font-size="12" font-weight="700" letter-spacing="1.6" fill="#ece6da">VISIT ↗</text></g>
  <g transform="translate(500 34)">
    <circle class="ping" cx="0" cy="0" r="3.5" fill="#6ee7a8"/><circle cx="0" cy="0" r="3.5" fill="#6ee7a8"/>
    <text x="10" y="4.5" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#6ee7a8">LIVE</text>
  </g>
  <g transform="translate(482 122)"><polygon points="48.5,0.0 0.0,28.0 0.0,-14.0 48.5,-42.0" fill="#191e29" /><polygon points="-48.5,0.0 0.0,28.0 0.0,-14.0 -48.5,-42.0" fill="#222838" /><polygon points="0.0,-70.0 48.5,-42.0 0.0,-14.0 -48.5,-42.0" fill="#2b3242" /><g transform="translate(0.0 -62.0) scale(2.4)"><path d="M-14,4 L-6,1 L-6,6 Z" fill="#07090d"/><ellipse cx="-1" cy="2" rx="8" ry="5" fill="#07090d"/><g class="head"><circle cx="7" cy="-3" r="4.2" fill="#07090d"/><path d="M10.5,-4.4 L16,-2.6 L10.5,-1 Z" fill="#07090d"/><circle class="eye" cx="8.4" cy="-3.8" r="1.1" fill="#f5a524"/></g><line x1="-2" y1="7" x2="-3" y2="9.5" stroke="#07090d" stroke-width="1"/><line x1="2" y1="7" x2="2" y2="9.5" stroke="#07090d" stroke-width="1"/></g></g>
</svg>
