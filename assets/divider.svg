<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/><stop offset="0.2" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.8"/><stop offset="0.8" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#8b5cf6"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .d { transform-box: fill-box; transform-origin: center; animation: p 2.6s ease-in-out infinite; }
    @keyframes p { 0%,100% { transform: rotate(45deg) scale(.8); } 50% { transform: rotate(225deg) scale(1.15); } }
  </style>
  <rect x="0" y="13" width="1200" height="2" fill="url(#l)"/>
  <circle cy="14" r="9" fill="url(#dot)">
    <animate attributeName="cx" values="60;1140;60" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
  </circle>
  <rect class="d" x="594.0" y="8" width="12" height="12" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2"/>
</svg>
