<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="Persona Keyboard">
  <defs><clipPath id="wclip"><rect x="-80" y="0" width="160" height="80"/></clipPath></defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',Menlo,monospace; }
    .serif { font-family: Georgia,'Iowan Old Style','Times New Roman','Liberation Serif',serif; }
    
    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: .6; } to { transform: scale(2.8); opacity: 0; } }
    .arrow { animation: arrow 2.6s ease-in-out infinite; }
    @keyframes arrow { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
    .key { animation: key 3s ease-in-out infinite; } @keyframes key { 0%,80%,100% { transform: translateY(0); } 88% { transform: translateY(2.5px); } }.dot { animation: dot 1.2s ease-in-out infinite; } @keyframes dot { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    
  </style>
  <rect x="0.5" y="0.5" width="599" height="249" rx="16" fill="#fffdf9" stroke="#e5dfd2"/>
  <text x="32" y="44" class="mono" font-size="12" font-weight="700" letter-spacing="1.8" fill="#e0791b">02</text>
  <text x="58" y="44" class="mono" font-size="12" letter-spacing="1.8" fill="#6f6a60">ANDROID · AI</text>
  <text x="30" y="88" class="sans" font-size="29" font-weight="800" letter-spacing="-0.8" fill="#1b1915">Persona Keyboard</text>
  <text x="32" y="132" class="sans" font-size="16" fill="#3b3730">An Android keyboard with AI personas,</text><text x="32" y="156" class="sans" font-size="16" fill="#3b3730">emoji, GIFs, stickers and autocorrect.</text>
  <line x1="32" x2="568" y1="196" y2="196" stroke="#e5dfd2"/>
  <text x="32" y="225" class="mono" font-size="11.5" letter-spacing="1.4" fill="#6f6a60">KOTLIN · ANDROID</text>
  <g class="arrow"><text x="568" y="225" text-anchor="end" class="mono" font-size="12" font-weight="700" letter-spacing="1.6" fill="#1b1915">REPO ↗</text></g>
  <g transform="translate(500 34)">
    <circle class="ping" cx="0" cy="0" r="3.5" fill="#e0791b"/><circle cx="0" cy="0" r="3.5" fill="#e0791b"/>
    <text x="10" y="4.5" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#e0791b">NEW</text>
  </g>
