<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="“Huge thanks for crushing the recent release! Your clean code, fast problem-solving, and calm focus under pressure made all the difference. We are lucky to have your skill on the team.” — Loka Shankaraha, Credit Consultant &amp; Financial Advisory">
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono','DejaVu Sans Mono',Menlo,monospace; }
    .serif { font-family: Georgia,'Iowan Old Style','Times New Roman','Liberation Serif',serif; }
    .q { animation: q 6s ease-in-out infinite; } @keyframes q { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="16" fill="#12161e" stroke="#232a36"/>
  <text class="serif q" x="34" y="126" font-size="150" fill="#f5a524">“</text>
  <text x="120" y="88" class="serif" font-size="27" font-style="italic" fill="#ece6da">Huge thanks for crushing the recent release! Your clean code,</text><text x="120" y="128" class="serif" font-size="27" font-style="italic" fill="#ece6da">fast problem-solving, and calm focus under pressure made all</text><text x="120" y="168" class="serif" font-size="27" font-style="italic" fill="#ece6da">the difference. We are lucky to have your skill on the team.</text>
  <line x1="120" x2="160" y1="222" y2="222" stroke="#f5a524" stroke-width="2"/>
  <text x="174" y="227" class="sans" font-size="16" font-weight="700" fill="#ece6da">Loka Shankaraha</text>
  <text x="318" y="227" class="mono" font-size="12" letter-spacing="1.6" fill="#8b93a3">CREDIT CONSULTANT &amp; FINANCIAL ADVISORY</text>
</svg>
