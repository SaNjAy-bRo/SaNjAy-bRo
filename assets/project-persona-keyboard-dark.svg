<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Persona Keyboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0b1d"/><stop offset="1" stop-color="#090816"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <clipPath id="cl"><rect x="1" y="1" width="598" height="228" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',Menlo,monospace; }
    .sweep { animation: sweep 7s ease-in-out infinite; animation-delay: 0.9s; }
    @keyframes sweep { 0% { transform: translateX(-260px) skewX(-20deg); } 35%,100% { transform: translateX(660px) skewX(-20deg); } }
    .gl { animation: gl 6s ease-in-out infinite alternate; }
    @keyframes gl { from { opacity: .55; } to { opacity: 1; } }
    .live { transform-box: fill-box; transform-origin: center; animation: lv 1.8s ease-out infinite; }
    @keyframes lv { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
  </style>
  <g clip-path="url(#cl)">
    <rect width="600" height="230" fill="url(#bg)"/>
    <rect class="gl" width="600" height="230" fill="url(#glow)"/>
    <rect class="sweep" x="0" y="-20" width="140" height="270" fill="url(#sh)"/>
    <rect x="0" y="0" width="5" height="230" fill="url(#ac)"/>
  </g>
  <rect x="1" y="1" width="598" height="228" rx="22" fill="none" stroke="url(#ac)" stroke-opacity="0.5"/>

  <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#ac)"/>
  <text x="54" y="61" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#ffffff">PK</text>
  <text x="96" y="52" class="sans" font-size="23" font-weight="800" fill="#f5f7ff">Persona Keyboard</text>
  <text x="96" y="76" class="mono" font-size="12.5" font-weight="600" letter-spacing="1.5" fill="#9aa4c7">ANDROID · AI</text>

  <g transform="translate(508 30)">
    <rect width="66" height="26" rx="13" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
    <circle class="live" cx="15" cy="13" r="3.5" fill="#fbbf24"/>
    <circle cx="15" cy="13" r="3.5" fill="#fbbf24"/>
    <text x="26" y="17.5" class="mono" font-size="11.5" font-weight="800" fill="#fbbf24">NEW</text>
  </g>

  <text x="28" y="122" class="sans" font-size="16" fill="#f5f7ff" fill-opacity="0.9">An Android keyboard with AI personas, emoji,</text>
  <text x="28" y="146" class="sans" font-size="16" fill="#f5f7ff" fill-opacity="0.9">GIFs, stickers and autocorrect.</text>
  <rect x="28.0" y="176" width="68.4" height="28" rx="8" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.35"/><text x="40.0" y="194.5" class="mono" font-size="12.5" font-weight="600" fill="#f5f7ff" fill-opacity="0.85">Kotlin</text><rect x="104.4" y="176" width="75.8" height="28" rx="8" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.35"/><text x="116.4" y="194.5" class="mono" font-size="12.5" font-weight="600" fill="#f5f7ff" fill-opacity="0.85">Android</text>
  <text x="572" y="196" text-anchor="end" class="sans" font-size="20" font-weight="700" fill="#f472b6">↗</text>
</svg>
