<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02000a"/>
      <stop offset="50%" stop-color="#060f18"/>
      <stop offset="100%" stop-color="#010006"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#CCFF00"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes laserScan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
    }
    .scan-line {
      animation: laserScan 4s ease-in-out infinite alternate;
    }
    .pulse-dot {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Radial Core Glow -->
  <circle cx="425" cy="130" r="280" fill="url(#glowCore)" />

  <!-- Cyber Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/>
    <line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="260"/>
    <line x1="250" y1="0" x2="250" y2="260"/>
    <line x1="400" y1="0" x2="400" y2="260"/>
    <line x1="550" y1="0" x2="550" y2="260"/>
    <line x1="700" y1="0" x2="700" y2="260"/>
  </g>

  <!-- Status HUD Pill -->
  <g transform="translate(300, 26)">
    <rect width="250" height="28" rx="14" fill="#000000" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#10B981" class="pulse-dot"/>
    <text x="30" y="18" fill="#10B981" font-size="10" font-weight="700" class="mono-text" letter-spacing="1.5">LIVE ARCHITECT TELEMETRY</text>
  </g>

  <!-- Monumental Name Title -->
  <text x="425" y="115" text-anchor="middle" fill="url(#textGrad)" font-size="44" class="title-text" filter="url(#laserGlow)">SANJAY KUMAR</text>

  <!-- Headline Subtitle -->
  <text x="425" y="152" text-anchor="middle" fill="#E2E8F0" font-size="15" font-weight="500" class="title-text" letter-spacing="0.5">Creative Full-Stack Engineer &amp; Digital Architect</text>

  <!-- Tech Focus Strip -->
  <text x="425" y="180" text-anchor="middle" fill="#94A3B8" font-size="12" class="mono-text">NEXT.JS 15 // REACT 19 // DJANGO // 3D WEBGL // CLOUD INFRA</text>

  <!-- Bottom Laser Beam Track -->
  <line x1="60" y1="216" x2="790" y2="216" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="300" y1="216" x2="550" y2="216" stroke="#10B981" stroke-width="2" filter="url(#laserGlow)"/>

  <!-- Telemetry Badge Icons -->
  <text x="180" y="240" text-anchor="middle" fill="#10B981" font-size="11" font-weight="700" class="mono-text">⚡ 3,775+ COMMITS THIS YEAR</text>
  <text x="425" y="240" text-anchor="middle" fill="#00F0FF" font-size="11" font-weight="700" class="mono-text">📁 75+ PRODUCTION PLATFORMS</text>
  <text x="670" y="240" text-anchor="middle" fill="#CCFF00" font-size="11" font-weight="700" class="mono-text">🚀 TOP 1% GLOBAL VELOCITY</text>
</svg>